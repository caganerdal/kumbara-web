name: Kira artış oranını güncelle

on:
  schedule:
    # TÜİK enflasyonu ayın 3'ünde 10:00'da açıklar (hafta sonuna denk gelirse ilk iş günü).
    # 3-8 arası her gün 11:30'da (TR) dener; veri değişmediyse commit atmaz.
    - cron: "30 8 3-8 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Oranları EVDS'den hesapla
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python3 scripts/update_rent_index.py

      - name: Değiştiyse kaydet
        run: |
          if git diff --quiet rent-index.json; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "kumbara-bot"
          git config user.email "kumbara-bot@users.noreply.github.com"
          git add rent-index.json
          git commit -m "Kira artış oranı güncellendi ($(date +%Y-%m-%d))"
          git push
